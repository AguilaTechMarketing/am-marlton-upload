<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Arthur Murray Marlton - Event Media Upload</title>
        <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Changed back to upload-container to match the CSS -->
        <div class="upload-container">
             <!-- Changed back to class="header" to match the CSS -->
             <div class="header">
                <img src="AMDS_Logo.png" alt="Arthur Murray Dance Center Logo">
                <h2>Arthur Murray Marlton</h2>
                <p>Share your event photos and videos with us!</p>
             </div>

             <div class="form-group">
                <label for="fileInput" class="custom-file-upload">
                    Choose Photos / Videos
                </label>
                 <input type="file" id="fileInput" accept="image/*,video/*" multiple required>
                 <div id="fileNameDisplay">No file(s) selected</div>
             </div>

             <button id="uploadBtn" disabled>Upload to Studio</button>
             <div id="uploadStatus"></div>

             <div id="progressContainer" class="hidden">
                <div class="progress-bar-bg">
                    <div id="progressBar"></div>
                </div>
                <p id="statusText">Ready to upload...</p>
             </div>

             <div class="footer">
                <p>&copy; 2026 Arthur Murray Marlton. All rights reserved.</p>
                <p>Contact us at <a href="mailto:info@arthurmurraymarlton.com">info@arthurmurraymarlton.com</a></p>
             </div>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
