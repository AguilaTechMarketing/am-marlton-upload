<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur Murray Marlton - Event Media Upload</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Arthur Murray Marlton</h1>
        <p>Share your event photos and videos with us!</p>
        
        <form id="uploadForm" action="https://script.google.com/macros/s/AKfycbzA-r2Ejkx22TZGmPCDRFxS7Q9rqMxtu1PdUpW3pd0K6-MXpGf19qL2oizMSE8TYxKzVA/exec" method="POST" target="hidden_iframe">
            <label for="fileInput" class="upload-btn">Choose Photos / Videos</label>
            <input type="file" id="fileInput" name="fileData" multiple required style="display:none;">
            <div id="fileName">No file(s) selected</div>
            
            <button type="submit" id="submitBtn">Upload to Studio</button>
        </form>
        
        <div id="status"></div>
    </div>

    <!-- Hidden iframe to handle form submission natively without CORS fetch errors -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){ handleUploadComplete(); }"></iframe>
    <script>var submitted = false;</script>

    <script src="script.js"></script>
</body>
</html>
