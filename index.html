<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur Murray Marlton - Event Media Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>Arthur Murray Marlton</h2>
            <p>Share your event photos and videos with us!</p>
        </header>

        <section class="upload-section">
            <form id="uploadForm">
                <label for="fileInput" class="custom-file-upload">
                    Choose Photos / Videos
                </label>
                <input type="file" id="fileInput" accept="image/*,video/*" multiple required>

                <div id="fileName">No file(s) selected</div>

                <button type="submit" id="submitBtn">Upload to Studio</button>
            </form>

            <div id="status"></div>
        </section>

        <footer>
            <p>&copy; 2026 Arthur Murray Marlton. All rights reserved.</p>
            <p>Contact us at <a href="mailto:info@arthurmurraymarlton.com">info@arthurmurraymarlton.com</a></p>
        </footer>
    </div>

    <!-- Hidden iframe used to submit Base64-encoded form payloads without CORS errors -->
    <iframe id="hiddenFrame" name="hiddenFrame" style="display:none;"></iframe>

    <script src="script.js"></script>
</body>
</html>
